<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>සම්පත් | අකුරු මංසල</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { navy: '#0F2C59', gold: '#D4A017' } } } } }
</script>
<style>
    body { font-family: 'Noto Serif Sinhala', sans-serif; background: #F8F9FC; color: #1e293b; }
    body.dark { background: #0a0f1e; color: #e2e8f0; }
    .container-wide { width: 100%; max-width: 1920px; padding: 0 1rem; margin: 0 auto; }
    @media (min-width: 1024px) { .container-wide { padding: 0 2rem; } }
    .main-nav { background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); box-shadow: 0 4px 30px rgba(15,44,89,0.1); position: sticky; top: 0; z-index: 50; }
    body.dark .main-nav { background: rgba(26,26,46,0.98); }
    .logo-wrap { width: 70px; height: 70px; background: white; border-radius: 1.2rem; border: 2px solid rgba(212,160,23,0.4); display: flex; align-items: center; justify-content: center; padding: 0.4rem; }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .nav-link { font-weight: 700; color: #0F2C59; padding: 0.75rem 1.2rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; border-radius: 0.85rem; transition: all 0.3s; }
    body.dark .nav-link { color: #cbd5e1; }
    .nav-link i { color: #D4A017; }
    .nav-link:hover, .nav-link.active { color: #D4A017; background: rgba(212,160,23,0.1); }
    .theme-toggle { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid rgba(255,255,255,0.3); }
    .page-hero { background: linear-gradient(135deg, #0F2C59, #1B3A6B); color: white; padding: 4rem 0; }
    .filter-section { background: white; border-radius: 1.5rem; padding: 1.5rem; margin-top: -3rem; position: relative; z-index: 10; box-shadow: 0 15px 40px rgba(15,44,89,0.1); }
    body.dark .filter-section { background: #1a1a2e; }
    .filter-input { width: 100%; padding: 0.9rem 1.25rem; border: 2px solid #e5e7eb; border-radius: 1rem; font-size: 1rem; background: #F8F9FC; }
    body.dark .filter-input { background: #0a0f1e; border-color: #334155; color: #e2e8f0; }
    .tab-btn { padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: 700; cursor: pointer; border: none; background: rgba(15,44,89,0.05); color: #0F2C59; }
    body.dark .tab-btn { background: rgba(255,255,255,0.05); color: #cbd5e1; }
    .tab-btn.active { background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; }
    #resourcesContainer { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 768px) { #resourcesContainer { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { #resourcesContainer { grid-template-columns: repeat(3, 1fr); } }
    .resource-card { background: white; border-radius: 1.25rem; overflow: hidden; box-shadow: 0 8px 25px rgba(15,44,89,0.08); display: flex; flex-direction: column; border: 1px solid rgba(212,160,23,0.1); transition: all 0.4s; }
    body.dark .resource-card { background: #1a1a2e; }
    .resource-card:hover { transform: translateY(-8px); box-shadow: 0 20px 45px rgba(15,44,89,0.2); }
    .resource-header { height: 180px; background: linear-gradient(135deg, #0F2C59, #1B3A6B); display: flex; align-items: center; justify-content: center; position: relative; }
    .resource-header i { font-size: 4rem; color: rgba(212,160,23,0.6); }
    .resource-badge { position: absolute; top: 0.75rem; right: 0.75rem; background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; padding: 0.35rem 0.85rem; border-radius: 999px; font-weight: 800; font-size: 0.7rem; }
    .resource-info { padding: 1.25rem; flex: 1; }
    .resource-info h3 { font-weight: 800; font-size: 1.05rem; color: #0F2C59; margin-bottom: 0.5rem; }
    body.dark .resource-info h3 { color: #e2e8f0; }
    .resource-info p { font-size: 0.85rem; color: #64748b; }
    .resource-actions { padding: 1rem 1.25rem; border-top: 1px solid rgba(15,44,89,0.08); }
    body.dark .resource-actions { border-top-color: rgba(255,255,255,0.08); }
    .btn-view { width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; background: linear-gradient(135deg, #0F2C59, #1B3A6B); color: white; font-weight: 700; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn-view.disabled { background: #94a3b8; cursor: not-allowed; }
    .empty-state { grid-column: 1/-1; text-align: center; padding: 4rem 2rem; }
    .empty-state i { font-size: 4rem; color: #cbd5e1; margin-bottom: 1rem; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(212,160,23,0.2); border-top-color: #D4A017; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { background: linear-gradient(180deg, #0F2C59, #0a1a3a); color: white; padding: 3rem 0 2rem; margin-top: 4rem; }
    .pdf-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; visibility: hidden; transition: all 0.3s; }
    .pdf-modal.show { opacity: 1; visibility: visible; }
    .pdf-modal-content { background: white; border-radius: 1rem; width: 100%; max-width: 1200px; height: 95vh; display: flex; flex-direction: column; overflow: hidden; }
    .pdf-modal-header { padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #0F2C59, #1B3A6B); color: white; }
    .pdf-modal-close { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); border: none; color: white; cursor: pointer; }
    .pdf-modal-body { flex: 1; background: #525659; }
    .pdf-modal-body iframe { width: 100%; height: 100%; border: none; }
    .pdf-modal-actions { padding: 0.75rem 1.5rem; display: flex; gap: 0.5rem; background: #f8f9fc; border-top: 1px solid #e5e7eb; }
    .pdf-action-btn { padding: 0.5rem 1rem; border-radius: 0.5rem; background: #0F2C59; color: white; border: none; cursor: pointer; text-decoration: none; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.4rem; }
    .pdf-action-btn.gold { background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; }
    .pdf-action-btn.red { background: #ef4444; }
</style>
</head>
<body>

<header class="main-nav">
    <div class="container-wide">
        <div style="height: 96px; display: flex; align-items: center; justify-content: space-between;">
            <a href="/" style="display: flex; align-items: center; gap: 1rem; text-decoration: none;">
                <div class="logo-wrap"><img src="/images/logo-icon.jpg" alt="Logo" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-graduation-cap\' style=\'color:#D4A017;font-size:2rem\'></i>'"></div>
                <div style="display: none;" class="sm-show">
                    <h1 style="font-size: 1.5rem; font-weight: 900; color: #0F2C59; line-height: 1;">අකුරු මංසල</h1>
                    <p style="font-size: 0.9rem; color: #D4A017; font-weight: 700; margin-top: 0.25rem;">ඉගෙනුමට නව මඟක්</p>
                </div>
            </a>
            <nav style="display: none;" class="lg-show">
                <a href="/" class="nav-link"><i class="fa-solid fa-home"></i>මුල් පිටුව</a>
                <a href="/resources.html" class="nav-link active"><i class="fa-solid fa-book-open"></i>සම්පත්</a>
                <a href="/papers.html" class="nav-link"><i class="fa-solid fa-file-lines"></i>ප්‍රශ්න පත්‍ර</a>
                <a href="/videos.html" class="nav-link"><i class="fa-solid fa-video"></i>වීඩියෝ</a>
            </nav>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <button onclick="toggleTheme()" class="theme-toggle"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
                <a href="/login.html" style="background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; padding: 0.85rem 1.75rem; border-radius: 1rem; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; gap: 0.65rem;">
                    <i class="fa-solid fa-user-shield"></i><span>Admin</span>
                </a>
            </div>
        </div>
    </div>
</header>

<section class="page-hero">
    <div class="container-wide">
        <p style="color:#D4A017; font-weight:700; font-size:0.9rem; letter-spacing:0.2em; margin-bottom:0.75rem;"><i class="fa-solid fa-book-open" style="margin-right:0.5rem;"></i>LEARNING LIBRARY</p>
        <h1 style="font-size: 3rem; font-weight: 900; margin-bottom: 0.75rem;">අධ්‍යාපනික සම්පත්</h1>
        <p style="color: rgba(255,255,255,0.8); font-size: 1.1rem;">ශ්‍රේණියට සහ විෂයට ගැලපෙන පාඩම් සහ සටහන්</p>
    </div>
</section>

<section class="container-wide" style="margin-top: -2rem; position: relative; z-index: 20;">
    <div class="filter-section">
        <div style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;">
            <button class="tab-btn active" data-type="lesson" onclick="switchTab('lesson')"><i class="fa-solid fa-book"></i> පාඩම්</button>
            <button class="tab-btn" data-type="article" onclick="switchTab('article')"><i class="fa-solid fa-newspaper"></i> ලිපි</button>
        </div>
        <div style="display:grid; grid-template-columns: 1fr; gap:1rem;">
            <input type="text" id="searchInput" placeholder="සොයන්න..." class="filter-input">
        </div>
    </div>
</section>

<main class="container-wide" style="padding: 3rem 1rem;">
    <div id="resourcesContainer">
        <div class="empty-state"><div class="spinner"></div><p>Load වෙමින්...</p></div>
    </div>
</main>

<div id="pdfModal" class="pdf-modal" onclick="if(event.target===this)closePdfModal()">
    <div class="pdf-modal-content" onclick="event.stopPropagation()">
        <div class="pdf-modal-header">
            <h3 id="pdfModalTitle" style="font-weight:800; font-size:1.1rem;"><i class="fa-solid fa-file-pdf" style="margin-right:0.5rem;"></i>PDF බලන්න</h3>
            <button class="pdf-modal-close" onclick="closePdfModal()"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="pdf-modal-body"><iframe id="pdfIframe" src=""></iframe></div>
        <div class="pdf-modal-actions">
            <a id="pdfDownloadBtn" href="" download class="pdf-action-btn gold"><i class="fa-solid fa-download"></i>Download</a>
            <a id="pdfNewTabBtn" href="" target="_blank" class="pdf-action-btn"><i class="fa-solid fa-external-link-alt"></i>නව Tab</a>
            <button onclick="closePdfModal()" class="pdf-action-btn red" style="margin-left:auto;"><i class="fa-solid fa-times"></i>වහන්න</button>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container-wide" style="text-align: center;">
        <p style="color: rgba(255,255,255,0.7);">© 2026 අකුරු මංසල · සියලු හිමිකම් ඇවිරිණි</p>
    </div>
</footer>

<script>
const API_BASE = '/api';
let currentType = 'lesson';
let allItems = [];
let filteredItems = [];

function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    document.getElementById('themeIcon').className = document.body.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}
function loadTheme() {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
    }
}
function extractArray(data) {
    if (!data) return [];
    if (Array.isArray(data)) return data;
    const keys = ['lessons', 'articles', 'papers', 'videos', 'data', 'results', 'items'];
    for (const key of keys) {
        if (Array.isArray(data[key])) return data[key];
    }
    for (const key of Object.keys(data)) {
        if (Array.isArray(data[key])) return data[key];
    }
    return [];
}

function switchTab(type) {
    currentType = type;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
    loadResources();
}

async function loadResources() {
    const c = document.getElementById('resourcesContainer');
    c.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Load වෙමින්...</p></div>';
    
    try {
        const res = await fetch(`${API_BASE}/resources?type=${currentType}&limit=100`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allItems = extractArray(data);
        filteredItems = [...allItems];
        renderResources();
    } catch (err) {
        c.innerHTML = `<div class="empty-state"><i class="fa-solid fa-exclamation-triangle" style="color:#ef4444"></i><p style="color:#ef4444;font-weight:700;">දෝෂයක්: ${err.message}</p></div>`;
    }
}

function renderResources() {
    const c = document.getElementById('resourcesContainer');
    if (filteredItems.length === 0) {
        c.innerHTML = `<div class="empty-state"><i class="fa-solid fa-folder-open"></i><p style="color:#64748b;font-weight:700;">සම්පත් නොමැත</p></div>`;
        return;
    }
    const iconMap = { lesson: 'fa-book-open', article: 'fa-newspaper' };
    const badgeMap = { lesson: 'පාඩම', article: 'ලිපිය' };
    
    c.innerHTML = filteredItems.map(item => {
        const hasPdf = item.pdf_file && item.pdf_file.length > 0;
        const hasContent = item.content && item.content.length > 0;
        let actionBtn = '';
        if (hasPdf) actionBtn = `<button onclick="openPdf('${item.id}')" class="btn-view"><i class="fa-solid fa-file-pdf"></i>PDF බලන්න</button>`;
        else if (hasContent) actionBtn = `<button onclick="showContent(${item.id})" class="btn-view"><i class="fa-solid fa-eye"></i>කියවන්න</button>`;
        else actionBtn = `<button class="btn-view disabled" disabled><i class="fa-solid fa-info-circle"></i>තොරතුරු නොමැත</button>`;
        
        return `
            <div class="resource-card">
                <div class="resource-header">
                    <i class="fa-solid ${iconMap[currentType]}"></i>
                    <span class="resource-badge">${badgeMap[currentType]}</span>
                </div>
                <div class="resource-info">
                    <h3>${escapeHtml(item.title)}</h3>
                    <p>${item.grade_name ? `<i class="fa-solid fa-graduation-cap" style="color:#D4A017"></i> ${escapeHtml(item.grade_name)}` : ''} ${item.subject_name ? `• <i class="fa-solid fa-book" style="color:#D4A017"></i> ${escapeHtml(item.subject_name)}` : ''}</p>
                    ${item.description ? `<p style="margin-top:0.5rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${escapeHtml(item.description)}</p>` : ''}
                </div>
                <div class="resource-actions">${actionBtn}</div>
            </div>
        `;
    }).join('');
}

function openPdf(itemId) {
    const item = allItems.find(i => String(i.id) === String(itemId));
    if (!item || !item.pdf_file) return;
    const pdfUrl = item.pdf_file;
    const isDataUrl = pdfUrl.startsWith('data:');
    
    if (isDataUrl) {
        const newTab = window.open();
        if (newTab) {
            newTab.document.write(`<!DOCTYPE html><html><head><title>${escapeHtml(item.title)}</title></head><body style="margin:0"><embed src="${pdfUrl}" type="application/pdf" width="100%" height="100%" /></body></html>`);
            newTab.document.close();
        }
        return;
    }
    document.getElementById('pdfModalTitle').innerHTML = `<i class="fa-solid fa-file-pdf" style="margin-right:0.5rem;"></i>${escapeHtml(item.title)}`;
    document.getElementById('pdfIframe').src = pdfUrl;
    document.getElementById('pdfDownloadBtn').href = pdfUrl;
    document.getElementById('pdfNewTabBtn').href = pdfUrl;
    document.getElementById('pdfModal').classList.add('show');
}

function closePdfModal() {
    document.getElementById('pdfModal').classList.remove('show');
    document.getElementById('pdfIframe').src = '';
}

function showContent(itemId) {
    const item = allItems.find(i => i.id === itemId);
    if (!item) return;
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
        <div style="background:white;border-radius:1rem;max-width:800px;width:100%;max-height:90vh;overflow:auto;" onclick="event.stopPropagation()">
            <div style="position:sticky;top:0;background:linear-gradient(135deg,#0F2C59,#1B3A6B);color:white;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;">
                <h2 style="font-weight:800;font-size:1.2rem;">${escapeHtml(item.title)}</h2>
                <button onclick="this.closest('div').parentElement.parentElement.remove()" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.2);border:none;color:white;cursor:pointer;"><i class="fa-solid fa-times"></i></button>
            </div>
            <div style="padding:2rem;">
                <p style="color:#64748b;margin-bottom:1rem;">${escapeHtml(item.grade_name || '')} ${item.subject_name ? '• ' + escapeHtml(item.subject_name) : ''}</p>
                ${item.description ? `<p style="font-style:italic;margin-bottom:1rem;color:#475569;">${escapeHtml(item.description)}</p>` : ''}
                <div style="white-space:pre-wrap;line-height:1.8;color:#1e293b;">${escapeHtml(item.content)}</div>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

document.addEventListener('DOMContentLoaded', () => {
    loadTheme();
    loadResources();
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePdfModal(); });
</script>

</body>
</html>
