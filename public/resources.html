<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>සම්පත් | අකුරු මංසල</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-navy': '#1e293b',
                        'brand-gold': '#D4A017',
                        'brand-gold2': '#fbbf24',
                    },
                    fontFamily: {
                        'sinhala': ['Noto Sans Sinhala', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans Sinhala', sans-serif; }
        .stat-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            transform: translateY(-2px);
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1rem;
            overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 1rem;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }
        .dark body { background-color: #0f172a; color: #e2e8f0; }
        .dark .stat-card { background-color: #1e293b; color: #e2e8f0; }
        .dark .modal-content { background-color: #1e293b; color: #e2e8f0; }
        .dark .text-brand-navy { color: #f1f5f9; }
        .dark .text-gray-500 { color: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2">
                <img src="/images/logo.png" alt="Logo" class="w-10 h-10 rounded-lg" onerror="this.style.display='none'">
                <div>
                    <h1 class="font-black text-brand-navy text-lg leading-tight">අකුරු මංසල</h1>
                    <p class="text-[10px] text-gray-500">ඉගෙනුමට නව මඟක්</p>
                </div>
            </a>
            <nav class="hidden md:flex items-center space-x-6 text-sm font-bold">
                <a href="/" class="text-gray-600 hover:text-brand-gold transition">මුල් පිටුව</a>
                <a href="/resources.html" class="text-brand-gold">සම්පත්</a>
                <a href="/papers.html" class="text-gray-600 hover:text-brand-gold transition">ප්‍රශ්න පත්‍ර</a>
                <a href="/videos.html" class="text-gray-600 hover:text-brand-gold transition">වීඩියෝ</a>
            </nav>
            <a href="/admin.html" class="bg-brand-gold text-brand-navy px-4 py-2 rounded-lg font-bold text-sm hover:bg-brand-gold2 transition">
                <i class="fa-solid fa-user-shield mr-1"></i> Admin
            </a>
        </div>
    </header>

    <!-- Hero -->
    <section class="bg-brand-navy text-white py-12">
        <div class="max-w-7xl mx-auto px-4">
            <p class="text-brand-gold text-xs font-black tracking-widest uppercase mb-2">Learning Resources</p>
            <h1 class="text-4xl md:text-5xl font-black mb-2">පාඩම් සම්පත්</h1>
            <p class="text-white/70 text-sm">1 සිට 13 ශ්‍රේණිය දක්වා පාඩම් සහ සම්පත්</p>
        </div>
    </section>

    <!-- Filters -->
    <section class="max-w-7xl mx-auto px-4 -mt-6">
        <div class="bg-white rounded-2xl shadow-lg p-4 grid grid-cols-1 md:grid-cols-3 gap-3">
            <input type="text" id="searchInput" placeholder="පාඩම් සොයන්න..." class="border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-gold">
            <select id="gradeFilter" class="border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-gold">
                <option value="">සියලු ශ්‍රේණි</option>
            </select>
            <select id="subjectFilter" class="border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-gold">
                <option value="">සියලු විෂය</option>
            </select>
        </div>
    </section>

    <!-- Lessons List -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="lessonsContainer">
            <div class="text-center py-12">
                <div class="w-12 h-12 border-4 border-brand-gold border-t-transparent rounded-full animate-spin mx-auto"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-brand-navy text-white py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-white/60">
            © 2026 අකුරු මංසල • සියලු හිමිකම් ඇවිරිණි
        </div>
    </footer>

    <!-- Lesson Detail Modal -->
    <div id="lessonModal" class="modal-overlay">
        <div class="modal-content">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600">
                <i class="fa-solid fa-times"></i>
            </button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let allLessons = [];

        // ============================================
        // LOAD FILTERS
        // ============================================
        async function loadFilters() {
            try {
                const [gradesRes, subjectsRes] = await Promise.all([
                    fetch(`${API_BASE}/grades`),
                    fetch(`${API_BASE}/subjects`)
                ]);
                const grades = await gradesRes.json();
                const subjects = await subjectsRes.json();

                const gradeFilter = document.getElementById('gradeFilter');
                grades.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.textContent = g.grade_name;
                    gradeFilter.appendChild(opt);
                });

                const subjectFilter = document.getElementById('subjectFilter');
                subjects.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = s.subject_name;
                    subjectFilter.appendChild(opt);
                });
            } catch (err) {
                console.error('Filter load error:', err);
            }
        }

        // ============================================
        // LOAD LESSONS
        // ============================================
        async function loadLessons() {
            const container = document.getElementById('lessonsContainer');
            try {
                const res = await fetch(`${API_BASE}/resources?type=lesson&limit=200`);
                const data = await res.json();
                allLessons = data.lessons || [];
                renderLessons(allLessons);
            } catch (err) {
                container.innerHTML = `<div class="stat-card text-center py-16 text-red-500">දෝෂයක්: ${err.message}</div>`;
            }
        }

        // ============================================
        // RENDER LESSONS
        // ============================================
        function renderLessons(lessons) {
            const container = document.getElementById('lessonsContainer');

            if (!lessons || lessons.length === 0) {
                container.innerHTML = `
                    <div class="stat-card text-center py-16">
                        <i class="fa-solid fa-book-open text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 text-lg">පාඩම් නොමැත</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${lessons.map(l => `
                        <div class="stat-card border-t-4 border-brand-gold p-6 cursor-pointer" onclick="openLesson(${l.id})">
                            <div class="flex items-start space-x-4">
                                <div class="w-14 h-14 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0">
                                    <i class="fa-solid fa-book-open text-2xl"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-bold text-brand-navy text-base mb-1 line-clamp-2">${l.title}</h3>
                                    <p class="text-xs text-gray-500 mb-2">
                                        ${l.grade_name || ''} ${l.subject_name ? '• ' + l.subject_name : ''}
                                    </p>
                                    <p class="text-xs text-gray-400 line-clamp-2">${l.description ? l.description.substring(0, 100) + '...' : 'විස්තරයක් නොමැත'}</p>
                                    <button class="mt-3 text-brand-gold font-bold text-sm flex items-center gap-1">
                                        බලන්න <i class="fa-solid fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // ============================================
        // OPEN LESSON MODAL
        // ============================================
        async function openLesson(id) {
            const modal = document.getElementById('lessonModal');
            const modalBody = document.getElementById('modalBody');

            modalBody.innerHTML = `<div class="text-center py-8"><div class="w-12 h-12 border-4 border-brand-gold border-t-transparent rounded-full animate-spin mx-auto"></div></div>`;
            modal.classList.add('active');

            try {
                const res = await fetch(`${API_BASE}/resources/lesson/${id}`);
                const lesson = await res.json();

                modalBody.innerHTML = `
                    <div class="mb-6">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center">
                                <i class="fa-solid fa-book-open text-xl"></i>
                            </div>
                            <div>
                                <p class="text-xs text-brand-gold font-black uppercase">පාඩම</p>
                                <h2 class="text-2xl font-black text-brand-navy">${lesson.title}</h2>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-2 mb-4">
                            ${lesson.grade_name ? `<span class="text-xs font-bold bg-brand-navy text-white px-3 py-1 rounded-full">${lesson.grade_name}</span>` : ''}
                            ${lesson.subject_name ? `<span class="text-xs font-bold bg-brand-gold text-brand-navy px-3 py-1 rounded-full">${lesson.subject_name}</span>` : ''}
                        </div>
                    </div>
                    <div class="prose max-w-none text-gray-700 leading-relaxed whitespace-pre-wrap">${lesson.description || 'විස්තරයක් නොමැත'}</div>
                `;
            } catch (err) {
                modalBody.innerHTML = `<div class="text-center py-8 text-red-500">දෝෂයක්: ${err.message}</div>`;
            }
        }

        function closeModal() {
            document.getElementById('lessonModal').classList.remove('active');
        }

        document.getElementById('lessonModal').addEventListener('click', (e) => {
            if (e.target.id === 'lessonModal') closeModal();
        });

        // ============================================
        // FILTERS
        // ============================================
        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const gradeId = document.getElementById('gradeFilter').value;
            const subjectId = document.getElementById('subjectFilter').value;

            const filtered = allLessons.filter(l => {
                const matchSearch = !search || (l.title || '').toLowerCase().includes(search);
                const matchGrade = !gradeId || String(l.grade_id) === gradeId;
                const matchSubject = !subjectId || String(l.subject_id) === subjectId;
                return matchSearch && matchGrade && matchSubject;
            });

            renderLessons(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('gradeFilter').addEventListener('change', applyFilters);
        document.getElementById('subjectFilter').addEventListener('change', applyFilters);

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', async () => {
            await loadFilters();
            await loadLessons();
        });
    </script>

</body>
</html>
