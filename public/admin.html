<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | අකුරු මංසල</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600;700;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sinhala: ['"Noto Serif Sinhala"', 'sans-serif'],
                        english: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#0F2C59',
                            navy2: '#1B3A6B',
                            navy3: '#2A4A7F',
                            gold: '#D4A017',
                            gold2: '#E8B923',
                            light: '#F8F9FC',
                            gray: '#6B7280',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Serif Sinhala', 'Poppins', sans-serif;
            background: #F8F9FC;
            color: #1e293b;
        }

        body.dark {
            background: #0a0f1e;
            color: #e2e8f0;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: #0F2C59;
            color: white;
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 40;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: transform 0.3s;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1.25rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
            cursor: pointer;
            color: rgba(255,255,255,0.8);
            margin-bottom: 0.25rem;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .sidebar-link:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .sidebar-link.active {
            background: linear-gradient(135deg, #D4A017, #E8B923);
            color: #0F2C59;
            box-shadow: 0 4px 15px rgba(212, 160, 23, 0.3);
        }

        .sidebar-link i {
            width: 20px;
            font-size: 1rem;
            text-align: center;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 260px;
            padding: 2rem;
            min-height: 100vh;
            transition: margin-left 0.3s;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 1rem;
            }
        }

        /* ===== STAT CARDS ===== */
        .stat-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(15, 44, 89, 0.08);
            transition: all 0.3s;
        }

        body.dark .stat-card {
            background: #1a1a2e;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(15, 44, 89, 0.15);
        }

        /* ===== DATA TABLE ===== */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(15, 44, 89, 0.08);
        }

        body.dark .data-table {
            background: #1a1a2e;
        }

        .data-table th {
            background: #F8F9FC;
            padding: 1rem;
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6B7280;
            font-weight: 800;
            border-bottom: 1px solid #e5e7eb;
        }

        body.dark .data-table th {
            background: #0a0f1e;
            border-bottom-color: #334155;
            color: #94a3b8;
        }

        .data-table td {
            padding: 1rem;
            border-bottom: 1px solid #f3f4f6;
            font-size: 0.875rem;
        }

        body.dark .data-table td {
            border-bottom-color: #334155;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table tr:hover td {
            background: #F8F9FC;
        }

        body.dark .data-table tr:hover td {
            background: #0a0f1e;
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            background: linear-gradient(135deg, #D4A017, #E8B923);
            color: #0F2C59;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 160, 23, 0.4);
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            padding: 0.5rem 0.875rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        /* ===== FORM ===== */
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            border: 2px solid #e5e7eb;
            font-size: 0.875rem;
            transition: all 0.3s;
            background: white;
            font-family: inherit;
            color: #1e293b;
        }

        body.dark .form-input {
            background: #0a0f1e;
            border-color: #334155;
            color: white;
        }

        .form-input:focus {
            outline: none;
            border-color: #D4A017;
            box-shadow: 0 0 0 4px rgba(212, 160, 23, 0.1);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            border-radius: 1.5rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        body.dark .modal-content {
            background: #1a1a2e;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 70;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            color: white;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideDown 0.3s ease-out;
            max-width: 90%;
        }

        .toast.success { background: #10b981; }
        .toast.error { background: #dc2626; }
        .toast.info { background: #3b82f6; }

        @keyframes slideDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F8F9FC; }
        ::-webkit-scrollbar-thumb { background: #D4A017; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #E8B923; }
    </style>
</head>
<body>

    <!-- ============================================
         SIDEBAR
         ============================================ -->
    <aside class="sidebar" id="sidebar">
        <div class="p-6 border-b border-white/10">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center p-1.5 shadow-lg">
                    <img src="/images/logo-icon.jpg" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-lg font-black text-white">අකුරු මංසල</h1>
                    <p class="text-xs text-white/60">Admin Panel</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 p-4">
            <button onclick="showTab('dashboard')" class="sidebar-link active" data-tab="dashboard">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </button>
            <button onclick="showTab('lessons')" class="sidebar-link" data-tab="lessons">
                <i class="fa-solid fa-book-open"></i>
                <span>පාඩම්</span>
            </button>
            <button onclick="showTab('papers')" class="sidebar-link" data-tab="papers">
                <i class="fa-solid fa-file-lines"></i>
                <span>ප්‍රශ්න පත්‍ර</span>
            </button>
            <button onclick="showTab('videos')" class="sidebar-link" data-tab="videos">
                <i class="fa-solid fa-video"></i>
                <span>වීඩියෝ</span>
            </button>
            <button onclick="showTab('articles')" class="sidebar-link" data-tab="articles">
                <i class="fa-solid fa-newspaper"></i>
                <span>ලිපි</span>
            </button>
            <button onclick="showTab('grades')" class="sidebar-link" data-tab="grades">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>ශ්‍රේණි</span>
            </button>
            <button onclick="showTab('subjects')" class="sidebar-link" data-tab="subjects">
                <i class="fa-solid fa-book"></i>
                <span>විෂයයන්</span>
            </button>
                        <button onclick="showTab('quizzes')" class="sidebar-link" data-tab="quizzes">
                <i class="fa-solid fa-bullseye"></i>
                <span>ප්‍රශ්නාවලි</span>
            </button>
            <button onclick="showTab('pending')" class="sidebar-link" data-tab="pending">
                <i class="fa-solid fa-clock"></i>
                <span>අනුමැතිය අපේක්ෂිත</span>
                <span id="pendingBadge" class="ml-auto bg-red-500 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
            </button>
            <button onclick="showTab('settings')" class="sidebar-link" data-tab="settings">
                <i class="fa-solid fa-cog"></i>
                <span>සැකසුම්</span>
            </button>
        </nav>

        <div class="p-4 border-t border-white/10">
            <div id="userInfo" class="mb-3 text-xs text-white/70 px-2"></div>
            <button onclick="logout()" class="sidebar-link bg-red-500/20 hover:bg-red-500/30 text-red-300">
                <i class="fa-solid fa-sign-out-alt"></i>
                <span>ඉවත් වන්න</span>
            </button>
        </div>
    </aside>

    <!-- ============================================
         MAIN CONTENT
         ============================================ -->
    <main class="main-content">
        <!-- Top Bar -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center space-x-4">
                <button onclick="toggleSidebar()" class="md:hidden w-10 h-10 rounded-lg bg-white shadow flex items-center justify-center">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div>
                    <h1 id="pageTitle" class="text-2xl md:text-3xl font-black text-brand-navy">Dashboard</h1>
                    <p id="pageSubtitle" class="text-sm text-gray-500 mt-1">පද්ධතියේ සමස්ත තොරතුරු</p>
                </div>
            </div>
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center hover:scale-110 transition">
                <i id="themeIcon" class="fa-solid fa-moon text-brand-navy"></i>
            </button>
        </div>

        <!-- Tab Content -->
        <div id="tabContent">
            <div class="flex items-center justify-center py-20">
                <div class="text-center">
                    <div class="w-16 h-16 border-4 border-brand-gold border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-gray-500">පූරණය වෙමින්...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- ============================================
         MODAL
         ============================================ -->
    <div id="modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h2 id="modalTitle" class="text-2xl font-black text-brand-navy">නව අයිතමය</h2>
                <button onclick="closeModal()" class="w-10 h-10 rounded-lg bg-gray-100 hover:bg-gray-200 flex items-center justify-center">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ============================================
         TOAST
         ============================================ -->
    <div id="toast" class="hidden"></div>

    <!-- ============================================
         SCRIPT
         ============================================ -->
    <script src="/js/admin.js"></script>
</body>
</html>
