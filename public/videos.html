<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Serif Sinhala', sans-serif; background: #F8F9FC; color: #1e293b; }
    body.dark { background: #0a0f1e; color: #e2e8f0; }
    .container-wide { width: 100%; max-width: 1920px; padding: 0 1rem; margin: 0 auto; }
    @media (min-width: 1024px) { .container-wide { padding: 0 2rem; } }

    .main-nav { background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); box-shadow: 0 4px 30px rgba(15,44,89,0.1); }
    body.dark .main-nav { background: rgba(26,26,46,0.98); }
    .logo-wrap { width: 70px; height: 70px; background: white; border-radius: 1.2rem; border: 2px solid rgba(212,160,23,0.4); display: flex; align-items: center; justify-content: center; padding: 0.4rem; }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .nav-link { font-weight: 700; color: #0F2C59; padding: 0.75rem 1.2rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; border-radius: 0.85rem; transition: all 0.3s; }
    body.dark .nav-link { color: #cbd5e1; }
    .nav-link i { color: #D4A017; }
    .nav-link:hover, .nav-link.active { color: #D4A017; background: rgba(212,160,23,0.1); }
    .theme-toggle { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid rgba(255,255,255,0.3); }
    .btn-primary { background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; padding: 0.85rem 1.75rem; border-radius: 1rem; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.65rem; }
    .page-hero { background: linear-gradient(135deg, #0F2C59, #1B3A6B); color: white; padding: 4rem 0; }
    .filter-section { background: white; border-radius: 1.5rem; padding: 1.5rem; margin-top: -3rem; position: relative; z-index: 10; box-shadow: 0 15px 40px rgba(15,44,89,0.1); }
    body.dark .filter-section { background: #1a1a2e; }
    .filter-input { width: 100%; padding: 0.9rem 1.25rem; border: 2px solid #e5e7eb; border-radius: 1rem; font-size: 1rem; background: #F8F9FC; }
    body.dark .filter-input { background: #0a0f1e; border-color: #334155; color: #e2e8f0; }
    .filter-input:focus { outline: none; border-color: #D4A017; }
    #videosContainer { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 768px) { #videosContainer { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { #videosContainer { grid-template-columns: repeat(3, 1fr); } }
    .video-card { background: white; border-radius: 1.25rem; overflow: hidden; box-shadow: 0 8px 25px rgba(15,44,89,0.08); cursor: pointer; display: flex; flex-direction: column; border: 1px solid rgba(212,160,23,0.1); transition: all 0.4s; }
    body.dark .video-card { background: #1a1a2e; }
    .video-card:hover { transform: translateY(-8px); box-shadow: 0 20px 45px rgba(15,44,89,0.2); }
    .video-thumb { position: relative; width: 100%; height: 200px; overflow: hidden; background: linear-gradient(135deg, #0F2C59, #1B3A6B); }
    .video-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
    .video-card:hover .video-thumb img { transform: scale(1.1); }
    .video-badge { position: absolute; top: 0.75rem; right: 0.75rem; background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; padding: 0.35rem 0.85rem; border-radius: 999px; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; }
    .video-play-btn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15,44,89,0.3); opacity: 0; transition: opacity 0.3s; }
    .video-card:hover .video-play-btn { opacity: 1; }
    .video-play-btn::after { content: '\f04b'; font-family: 'Font Awesome 6 Free'; font-weight: 900; font-size: 2rem; color: white; width: 70px; height: 70px; background: rgba(212,160,23,0.95); border-radius: 50%; display: flex; align-items: center; justify-content: center; padding-left: 5px; }
    .video-info { padding: 1.25rem; flex: 1; }
    .video-info h3 { font-weight: 800; font-size: 1.05rem; color: #0F2C59; margin-bottom: 0.5rem; }
    body.dark .video-info h3 { color: #e2e8f0; }
    .video-info p { font-size: 0.85rem; color: #64748b; }
    body.dark .video-info p { color: #94a3b8; }
    .empty-state { grid-column: 1/-1; text-align: center; padding: 4rem 2rem; }
    .empty-state i { font-size: 4rem; color: #cbd5e1; margin-bottom: 1rem; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(212,160,23,0.2); border-top-color: #D4A017; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer { background: linear-gradient(180deg, #0F2C59, #0a1a3a); color: white; padding: 3rem 0 2rem; margin-top: 4rem; }

    /* VIDEO MODAL */
    .video-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; visibility: hidden; transition: all 0.3s; }
    .video-modal.show { opacity: 1; visibility: visible; }
    .video-modal-content { background: white; border-radius: 1.5rem; width: 100%; max-width: 1000px; max-height: 95vh; display: flex; flex-direction: column; overflow: hidden; }
    body.dark .video-modal-content { background: #1a1a2e; }
    .video-modal-header { padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #0F2C59, #1B3A6B); color: white; }
    .video-modal-close { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .video-modal-close:hover { background: #ef4444; transform: rotate(90deg); }
    .video-embed-wrap { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; }
    .video-embed-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .video-modal-body { padding: 1.5rem; overflow-y: auto; }
    .video-modal-body h2 { font-size: 1.4rem; font-weight: 800; color: #0F2C59; margin-bottom: 0.5rem; }
    body.dark .video-modal-body h2 { color: #e2e8f0; }
    .video-modal-body .meta { font-size: 0.9rem; color: #64748b; margin-bottom: 1rem; }
    .video-modal-body .desc { color: #475569; line-height: 1.7; }
    body.dark .video-modal-body .desc { color: #cbd5e1; }

    /* YOUTUBE ERROR FALLBACK */
    .yt-error-fallback {
        position: absolute; inset: 0;
        background: linear-gradient(135deg, #0F2C59, #1B3A6B);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: white; padding: 2rem; text-align: center;
    }
    .yt-error-fallback i { font-size: 3rem; color: #D4A017; margin-bottom: 1rem; }
    .yt-error-fallback h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.5rem; }
    .yt-error-fallback p { color: rgba(255,255,255,0.8); margin-bottom: 1.5rem; max-width: 400px; }
    .yt-error-fallback a { background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; }

    /* YOUTUBE WATCH BUTTON (in actions) */
    .yt-actions { padding: 1rem 1.5rem; display: flex; gap: 0.75rem; border-top: 1px solid #e5e7eb; flex-wrap: wrap; }
    body.dark .yt-actions { border-top-color: #334155; }
    .yt-action-btn { padding: 0.6rem 1.2rem; border-radius: 0.75rem; font-weight: 700; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; border: none; cursor: pointer; }
    .yt-action-btn.primary { background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; }
    .yt-action-btn.youtube { background: #ff0000; color: white; }
    .yt-action-btn.close { background: #e5e7eb; color: #475569; margin-left: auto; }

    @media (max-width: 768px) {
        .page-hero { padding: 3rem 0; }
        .filter-section { margin-top: -2rem; padding: 1rem; }
        .video-thumb { height: 180px; }
        .video-modal-content { border-radius: 0; max-height: 100vh; }
    }
</style>
</head>

<!-- VIDEO MODAL -->
<div id="videoModal" class="video-modal" onclick="if(event.target===this)closeVideoModal()">
    <div class="video-modal-content" onclick="event.stopPropagation()">

            <h3 id="videoModalTitle"><i class="fa-solid fa-video mr-2"></i>වීඩියෝ</h3>

    </div>

<script>
const API_BASE = '/api';
let allVideos = [];
let filteredVideos = [];
let embedTimeout = null;

function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    document.getElementById('themeIcon').className = document.body.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}
function loadTheme() {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
    }
}

async function loadVideos() {
    const c = document.getElementById('videosContainer');
    c.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Load වෙමින්...</p></div>';
    try {
        const res = await fetch(`${API_BASE}/videos`);
        const data = await res.json();
        allVideos = data.videos || data.data || [];
        filteredVideos = [...allVideos];
        await loadFilters();
        renderVideos();
    } catch (err) {
        c.innerHTML = `<div class="empty-state"><i class="fa-solid fa-exclamation-triangle" style="color:#ef4444"></i><p class="text-red-500">${err.message}</p></div>`;
    }
}

async function loadFilters() {
    try {
        const [g, s] = await Promise.all([fetch(`${API_BASE}/grades`), fetch(`${API_BASE}/subjects`)]);
        const grades = await g.json();
        const subjects = await s.json();
        const gradesArr = Array.isArray(grades) ? grades : (grades.grades || []);
        const subjectsArr = Array.isArray(subjects) ? subjects : (subjects.subjects || []);
        gradesArr.forEach(gr => {
            const o = document.createElement('option'); o.value = gr.id; o.textContent = gr.grade_name;
            document.getElementById('gradeFilter').appendChild(o);
        });
        subjectsArr.forEach(su => {
            const o = document.createElement('option'); o.value = su.id; o.textContent = su.subject_name;
            document.getElementById('subjectFilter').appendChild(o);
        });
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('gradeFilter').addEventListener('change', applyFilters);
        document.getElementById('subjectFilter').addEventListener('change', applyFilters);
    } catch (err) { console.error(err); }
}

function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const gradeId = document.getElementById('gradeFilter').value;
    const subjectId = document.getElementById('subjectFilter').value;
    filteredVideos = allVideos.filter(v => {
        if (search && !(v.title || '').toLowerCase().includes(search)) return false;
        if (gradeId && String(v.grade_id) !== gradeId) return false;
        if (subjectId && String(v.subject_id) !== subjectId) return false;
        return true;
    });
    renderVideos();
}

function renderVideos() {
    const c = document.getElementById('videosContainer');
    if (filteredVideos.length === 0) {
        c.innerHTML = `<div class="empty-state"><i class="fa-solid fa-video-slash"></i><p class="text-gray-500 text-lg font-bold">වීඩියෝ නොමැත</p></div>`;
        return;
    }
    c.innerHTML = filteredVideos.map(v => {
        const youtubeId = v.youtube_id || extractYouTubeId(v.video_url) || '';
        const thumbnail = youtubeId ? `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg` : 'https://via.placeholder.com/400x200/0F2C59/D4A017?text=Video';
        return `
            <div class="video-card" onclick="openVideoModal(${v.id})">
                <div class="video-thumb">
                    <img src="${thumbnail}" alt="${escapeHtml(v.title)}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x200/0F2C59/D4A017?text=Video'">
                    <span class="video-badge">${escapeHtml(v.grade_name || 'Video')}</span>
                    <div class="video-play-btn"></div>
                </div>
                <div class="video-info">
                    <h3>${escapeHtml(v.title)}</h3>
                    <p><i class="fa-solid fa-graduation-cap mr-1"></i>${escapeHtml(v.grade_name || '')} ${v.subject_name ? '• ' + escapeHtml(v.subject_name) : ''}</p>
                </div>
            </div>
        `;
    }).join('');
}

// ============================================
// VIDEO MODAL
// ============================================
function openVideoModal(videoId) {
    const video = allVideos.find(v => v.id === videoId);
    if (!video) return;
    
    const youtubeId = video.youtube_id || extractYouTubeId(video.video_url) || '';
    const modal = document.getElementById('videoModal');
    
    document.getElementById('videoModalTitle').innerHTML = `<i class="fa-solid fa-video mr-2"></i>${escapeHtml(video.title)}`;
    document.getElementById('videoModalBody').innerHTML = `
        <h2>${escapeHtml(video.title)}</h2>
        <p class="meta"><i class="fa-solid fa-graduation-cap mr-1"></i>${escapeHtml(video.grade_name || '')} ${video.subject_name ? '• ' + escapeHtml(video.subject_name) : ''}</p>
        ${video.description ? `<p class="desc">${escapeHtml(video.description)}</p>` : ''}
    `;
    
    const iframe = document.getElementById('videoIframe');
    const watchBtn = document.getElementById('ytWatchBtn');
    const embedArea = document.getElementById('videoEmbedArea');
    
    if (youtubeId) {
        // Use youtube-nocookie.com and include origin for better embed support
        const origin = encodeURIComponent(window.location.origin);
        iframe.src = `https://www.youtube-nocookie.com/embed/${youtubeId}?autoplay=1&rel=0&origin=${origin}`;
        watchBtn.href = `https://www.youtube.com/watch?v=${youtubeId}`;
        
        // Remove any old error fallback
        const oldFallback = embedArea.querySelector('.yt-error-fallback');
        if (oldFallback) oldFallback.remove();
        
        // Set a timeout — if iframe doesn't load in 5s, show fallback
        clearTimeout(embedTimeout);
        embedTimeout = setTimeout(() => {
            // Check if iframe is still empty / error
            showEmbedFallback(youtubeId, video.title);
        }, 5000);
        
        // Listen for iframe load
        iframe.onload = () => {
            clearTimeout(embedTimeout);
            console.log('✅ YouTube iframe loaded');
        };
        
    } else {
        embedArea.innerHTML = `
            <div class="yt-error-fallback">
                <i class="fa-solid fa-exclamation-triangle"></i>
                <h3>වීඩියෝ URL එක වැරදි</h3>
                <p>මෙම වීඩියෝවට වලංගු YouTube ID එකක් නැහැ.</p>
            </div>
        `;
        watchBtn.style.display = 'none';
    }
    
    modal.classList.add('show');
}

function showEmbedFallback(youtubeId, title) {
    const embedArea = document.getElementById('videoEmbedArea');
    const existing = embedArea.querySelector('.yt-error-fallback');
    if (existing) return;
    
    // Check if iframe actually loaded content
    const iframe = document.getElementById('videoIframe');
    try {
        // If cross-origin, this will throw — which means it loaded something
        iframe.contentWindow.location.href;
        // Same-origin means it's empty (about:blank)
    } catch (e) {
        // Cross-origin — iframe loaded something, might be fine
        // But error 153 might still show
    }
    
    // Add a visible fallback button
    const fallback = document.createElement('div');
    fallback.className = 'yt-error-fallback';
    fallback.style.background = 'rgba(0,0,0,0.85)';
    fallback.style.top = 'auto';
    fallback.style.height = 'auto';
    fallback.style.padding = '1rem';
    fallback.innerHTML = `
        <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;justify-content:center;">
            <div style="text-align:left;">
                <p style="margin:0;font-weight:700;color:#D4A017;font-size:0.9rem;"><i class="fa-solid fa-info-circle"></i> වීඩියෝ embed කරන්න බැහැ</p>
                <p style="margin:0.25rem 0 0;font-size:0.8rem;color:rgba(255,255,255,0.7);">මෙම වීඩියෝව අයිතිකරු embed කිරීම අවහිර කරලා ඇත</p>
            </div>
            <a href="https://www.youtube.com/watch?v=${youtubeId}" target="_blank" style="background:#ff0000;color:white;padding:0.5rem 1rem;border-radius:0.5rem;text-decoration:none;font-weight:700;font-size:0.85rem;display:inline-flex;align-items:center;gap:0.4rem;">
                <i class="fa-brands fa-youtube"></i> YouTube එකේ නරඹන්න
            </a>
        </div>
    `;
    fallback.style.position = 'absolute';
    fallback.style.bottom = '0';
    fallback.style.left = '0';
    fallback.style.right = '0';
    embedArea.appendChild(fallback);
}

function closeVideoModal() {
    document.getElementById('videoModal').classList.remove('show');
    document.getElementById('videoIframe').src = '';
    const fallback = document.getElementById('videoEmbedArea').querySelector('.yt-error-fallback');
    if (fallback) fallback.remove();
    clearTimeout(embedTimeout);
}

function extractYouTubeId(url) {
    if (!url) return null;
    const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
    return match ? match[1] : null;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

document.addEventListener('DOMContentLoaded', () => {
    loadTheme();
    loadVideos();
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVideoModal(); });
</script>
