</style>

<!-- AOS Library -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
const API_BASE = '/api';

// ============================================
// STATE
// ============================================
let allVideos = [];
let filteredVideos = [];

// ============================================
// THEME
// ============================================
function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    const icon = document.getElementById('themeIcon');
    icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}

function loadTheme() {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
    }
}

// ============================================
// MOBILE MENU
// ============================================
function toggleMobileMenu() {
    document.getElementById('mobileMenu').classList.toggle('hidden');
}

// ============================================
// LOAD VIDEOS
// ============================================
async function loadVideos() {
    const container = document.getElementById('videosContainer');
    
    try {
        // Load videos
        const res = await fetch(`${API_BASE}/videos`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        allVideos = data.videos || data || [];
        filteredVideos = [...allVideos];
        
        console.log('✅ Videos loaded:', allVideos.length);
        
        // Load grades & subjects for filter
        await loadFilters();
        
        // Render
        renderVideos();
        
        // Init AOS after render
        if (typeof AOS !== 'undefined') {
            AOS.init({ duration: 600, once: true, offset: 50 });
            AOS.refresh();
        }
        
    } catch (err) {
        console.error('❌ Video load error:', err);
        container.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-exclamation-triangle" style="color: #ef4444;"></i>
                <p class="text-red-500 text-lg font-bold">දෝෂයක්: ${err.message}</p>
                <p class="text-gray-400 text-sm mt-2">කරුණාකර පසුව නැවත උත්සාහ කරන්න</p>
            </div>
        `;
    }
}

// ============================================
// LOAD FILTERS
// ============================================
async function loadFilters() {
    try {
        const [gradesRes, subjectsRes] = await Promise.all([
            fetch(`${API_BASE}/grades`),
            fetch(`${API_BASE}/subjects`)
        ]);
        
        const grades = await gradesRes.json();
        const subjects = await subjectsRes.json();
        
        const gradesArr = Array.isArray(grades) ? grades : (grades.grades || []);
        const subjectsArr = Array.isArray(subjects) ? subjects : (subjects.subjects || []);
        
        const gradeFilter = document.getElementById('gradeFilter');
        gradesArr.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g.id;
            opt.textContent = g.grade_name;
            gradeFilter.appendChild(opt);
        });
        
        const subjectFilter = document.getElementById('subjectFilter');
        subjectsArr.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.subject_name;
            subjectFilter.appendChild(opt);
        });
        
        // Add event listeners
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        gradeFilter.addEventListener('change', applyFilters);
        subjectFilter.addEventListener('change', applyFilters);
        
    } catch (err) {
        console.error('Filter load error:', err);
    }
}

// ============================================
// APPLY FILTERS
// ============================================
function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const gradeId = document.getElementById('gradeFilter').value;
    const subjectId = document.getElementById('subjectFilter').value;
    
    filteredVideos = allVideos.filter(v => {
        if (search && !v.title.toLowerCase().includes(search)) return false;
        if (gradeId && String(v.grade_id) !== gradeId) return false;
        if (subjectId && String(v.subject_id) !== subjectId) return false;
        return true;
    });
    
    renderVideos();
}

// ============================================
// RENDER VIDEOS — KEY FUNCTION
// ============================================
function renderVideos() {
    const container = document.getElementById('videosContainer');
    
    if (filteredVideos.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-video-slash"></i>
                <p class="text-gray-500 text-lg font-bold">වීඩියෝ නොමැත</p>
                <p class="text-gray-400 text-sm mt-2">කරුණාකර පසුව නැවත උත්සාහ කරන්න</p>
            </div>
        `;
        return;
    }
    
    // ⚠️ CRITICAL: data-aos attribute REMOVED to prevent hiding
    container.innerHTML = filteredVideos.map(v => {
        const youtubeId = v.youtube_id || extractYouTubeId(v.video_url) || '';
        const thumbnail = youtubeId 
            ? `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`
            : '/images/video-placeholder.jpg';
        
        return `
            <div class="video-card" onclick="openVideoModal(${v.id})">
                <div class="video-thumb">
                    <img src="${thumbnail}" 
                         alt="${escapeHtml(v.title)}" 
                         loading="lazy"
                         onerror="this.src='https://via.placeholder.com/400x200/0F2C59/D4A017?text=Video'">
                    <span class="video-badge">${escapeHtml(v.grade_name || 'Video')}</span>
                    <div class="video-play-btn"></div>
                </div>
                <div class="video-info">
                    <h3>${escapeHtml(v.title)}</h3>
                    <p>
                        <i class="fa-solid fa-graduation-cap mr-1"></i>
                        ${escapeHtml(v.grade_name || '')} 
                        ${v.subject_name ? '• ' + escapeHtml(v.subject_name) : ''}
                    </p>
                </div>
            </div>
        `;
    }).join('');
    
    // Refresh AOS after render
    if (typeof AOS !== 'undefined') {
        AOS.refresh();
    }
}

// ============================================
// VIDEO MODAL
// ============================================
function openVideoModal(videoId) {
    const video = allVideos.find(v => v.id === videoId);
    if (!video) return;
    
    const youtubeId = video.youtube_id || extractYouTubeId(video.video_url) || '';
    const modal = document.getElementById('videoModal');
    const body = document.getElementById('modalBody');
    
    body.innerHTML = `
        <div class="relative">
            <button onclick="closeVideoModal()" 
                    class="absolute top-3 right-3 z-10 w-10 h-10 rounded-full bg-white/90 dark:bg-gray-800 flex items-center justify-center text-gray-700 dark:text-white hover:bg-red-500 hover:text-white transition">
                <i class="fa-solid fa-times"></i>
            </button>
            ${youtubeId ? `
                <div class="aspect-video bg-black">
                    <iframe width="100%" height="100%" 
                            src="https://www.youtube.com/embed/${youtubeId}?autoplay=1" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                </div>
            ` : `
                <div class="aspect-video bg-gray-100 flex items-center justify-center">
                    <p class="text-gray-500">වීඩියෝ URL එක වැරදි</p>
                </div>
            `}
            <div class="p-6">
                <h2 class="text-xl md:text-2xl font-black text-brand-navy dark:text-white mb-2">
                    ${escapeHtml(video.title)}
                </h2>
                <p class="text-sm text-gray-500 mb-3">
                    <i class="fa-solid fa-graduation-cap mr-1"></i>
                    ${escapeHtml(video.grade_name || '')} 
                    ${video.subject_name ? '• ' + escapeHtml(video.subject_name) : ''}
                </p>
                ${video.description ? `
                    <p class="text-gray-600 dark:text-gray-300 leading-relaxed">
                        ${escapeHtml(video.description)}
                    </p>
                ` : ''}
            </div>
        </div>
    `;
    
    modal.classList.add('show');
}

function closeVideoModal() {
    document.getElementById('videoModal').classList.remove('show');
    document.getElementById('modalBody').innerHTML = '';
}

// ============================================
// HELPERS
// ============================================
function extractYouTubeId(url) {
    if (!url) return null;
    const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
    return match ? match[1] : null;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ============================================
// INIT
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    loadTheme();
    loadVideos();
});

// ESC key to close modal
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeVideoModal();
});
</script>
