<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>වීඩියෝ පාඩම් | අකුරු මංසල</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { navy: '#0F2C59', gold: '#D4A017' } } } } }
</script>
<style>
    body { font-family: 'Noto Serif Sinhala', sans-serif; background: #F8F9FC; color: #1e293b; }
    body.dark { background: #0a0f1e; color: #e2e8f0; }
    .container-wide { width: 100%; max-width: 1920px; padding: 0 1rem; margin: 0 auto; }
    @media (min-width: 1024px) { .container-wide { padding: 0 2rem; } }
    .main-nav { background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); box-shadow: 0 4px 30px rgba(15,44,89,0.1); }
    body.dark .main-nav { background: rgba(26,26,46,0.98); }
    .logo-wrap { width: 70px; height: 70px; background: white; border-radius: 1.2rem; border: 2px solid rgba(212,160,23,0.4); display: flex; align-items: center; justify-content: center; padding: 0.4rem; }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .nav-link { font-weight: 700; color: #0F2C59; padding: 0.75rem 1.2rem; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; border-radius: 0.85rem; }
    body.dark .nav-link { color: #cbd5e1; }
    .nav-link i { color: #D4A017; }
    .nav-link:hover, .nav-link.active { color: #D4A017; background: rgba(212,160,23,0.1); }
    .theme-toggle { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid rgba(255,255,255,0.3); }
    .page-hero { background: linear-gradient(135deg, #0F2C59, #1B3A6B); color: white; padding: 4rem 0; }
    .filter-section { background: white; border-radius: 1.5rem; padding: 1.5rem; margin-top: -3rem; position: relative; z-index: 10; box-shadow: 0 15px 40px rgba(15,44,89,0.1); }
    body.dark .filter-section { background: #1a1a2e; }
    .filter-input { width: 100%; padding: 0.9rem 1.25rem; border: 2px solid #e5e7eb; border-radius: 1rem; font-size: 1rem; background: #F8F9FC; }
    body.dark .filter-input { background: #0a0f1e; border-color: #334155; color: #e2e8f0; }
    #videosContainer { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 768px) { #videosContainer { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { #videosContainer { grid-template-columns: repeat(3, 1fr); } }
    .video-card { background: white; border-radius: 1.25rem; overflow: hidden; box-shadow: 0 8px 25px rgba(15,44,89,0.08); cursor: pointer; display: flex; flex-direction: column; border: 1px solid rgba(212,160,23,0.1); transition: all 0.4s; }
    body.dark .video-card { background: #1a1a2e; }
    .video-card:hover { transform: translateY(-8px); box-shadow: 0 20px 45px rgba(15,44,89,0.2); }
    .video-thumb { position: relative; width: 100%; height: 200px; overflow: hidden; background: linear-gradient(135deg, #0F2C59, #1B3A6B); }
    .video-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .video-badge { position: absolute; top: 0.75rem; right: 0.75rem; background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; padding: 0.35rem 0.85rem; border-radius: 999px; font-weight: 800; font-size: 0.7rem; }
    .video-info { padding: 1.25rem; flex: 1; }
    .video-info h3 { font-weight: 800; font-size: 1.05rem; color: #0F2C59; margin-bottom: 0.5rem; }
    body.dark .video-info h3 { color: #e2e8f0; }
    .video-info p { font-size: 0.85rem; color: #64748b; }
    .empty-state { grid-column: 1/-1; text-align: center; padding: 4rem 2rem; }
    .empty-state i { font-size: 4rem; color: #cbd5e1; margin-bottom: 1rem; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(212,160,23,0.2); border-top-color: #D4A017; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .debug-info { background: #fef3c7; border: 2px solid #f59e0b; padding: 1rem; border-radius: 0.75rem; margin: 1rem 0; font-family: monospace; font-size: 0.85rem; color: #78350f; }
    .footer { background: linear-gradient(180deg, #0F2C59, #0a1a3a); color: white; padding: 3rem 0 2rem; margin-top: 4rem; }
</style>
</head>
<body>

<header class="main-nav sticky top-0 z-50">
    <div class="container-wide">
        <div class="h-24 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-4">
                <div class="logo-wrap"><img src="/images/logo-icon.jpg" alt="Logo" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-graduation-cap text-brand-gold text-3xl\'></i>'"></div>
                <div class="hidden sm:block">
                    <h1 class="text-2xl font-black dark:text-white leading-none" style="color:#0F2C59">අකුරු මංසල</h1>
                    <p class="text-sm font-bold mt-1" style="color:#D4A017">ඉගෙනුමට නව මඟක්</p>
                </div>
            </a>
            <nav class="hidden lg:flex items-center space-x-1">
                <a href="/" class="nav-link"><i class="fa-solid fa-home"></i>මුල් පිටුව</a>
                <a href="/resources.html" class="nav-link"><i class="fa-solid fa-book-open"></i>සම්පත්</a>
                <a href="/papers.html" class="nav-link"><i class="fa-solid fa-file-lines"></i>ප්‍රශ්න පත්‍ර</a>
                <a href="/videos.html" class="nav-link active"><i class="fa-solid fa-video"></i>වීඩියෝ</a>
            </nav>
            <div class="flex items-center space-x-3">
                <button onclick="toggleTheme()" class="theme-toggle"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
                <a href="/login.html" class="hidden md:inline-flex" style="background: linear-gradient(135deg, #D4A017, #E8B923); color: #0F2C59; padding: 0.85rem 1.75rem; border-radius: 1rem; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; gap: 0.65rem;">
                    <i class="fa-solid fa-user-shield"></i><span>Admin</span>
                </a>
            </div>
        </div>
    </div>
</header>

<section class="page-hero">
    <div class="container-wide">
        <p style="color:#D4A017; font-weight:700; font-size:0.9rem; letter-spacing:0.2em; margin-bottom: 0.75rem;"><i class="fa-solid fa-video mr-2"></i>VIDEO LIBRARY</p>
        <h1 class="text-4xl md:text-6xl font-black mb-3">වීඩියෝ පාඩම්</h1>
        <p style="color: rgba(255,255,255,0.8); font-size: 1.1rem;">දරුවන්ට ආකර්ෂණීය වීඩියෝ පාඩම් නරඹන්න</p>
    </div>
</section>

<section class="container-wide -mt-8 relative z-20">
    <div class="filter-section">
        <div style="display:grid; grid-template-columns: 1fr; gap: 1rem;">
            <input type="text" id="searchInput" placeholder="වීඩියෝ සොයන්න..." class="filter-input">
        </div>
    </div>
</section>

<main class="container-wide py-12">
    <div id="debugInfo" class="debug-info">
        <strong>🔍 Debug:</strong> <span id="debugText">Loading...</span>
    </div>
    
    <div id="videosContainer">
        <div class="empty-state"><div class="spinner"></div><p>Load වෙමින්...</p></div>
    </div>
</main>

<footer class="footer">
    <div class="container-wide text-center">
        <p style="color: rgba(255,255,255,0.7);">© 2026 අකුරු මංසල · සියලු හිමිකම් ඇවිරිණි</p>
    </div>
</footer>

<script>
console.log('🚀 videos.html script START');

const API_BASE = '/api';
let allVideos = [];

function toggleTheme() {
    document.body.classList.toggle('dark');
    localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    document.getElementById('themeIcon').className = document.body.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}
function loadTheme() {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
    }
}

function debug(msg) {
    console.log('DEBUG:', msg);
    const el = document.getElementById('debugText');
    if (el) el.textContent = msg;
}

function extractArray(data) {
    if (!data) return [];
    if (Array.isArray(data)) return data;
    const keys = ['videos', 'papers', 'lessons', 'articles', 'data', 'results', 'items'];
    for (const key of keys) {
        if (Array.isArray(data[key])) return data[key];
    }
    for (const key of Object.keys(data)) {
        if (Array.isArray(data[key])) return data[key];
    }
    return [];
}

async function loadVideos() {
    console.log('🔄 loadVideos() called');
    const c = document.getElementById('videosContainer');
    c.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>Load වෙමින්...</p></div>';
    
    try {
        debug('Fetching /api/videos...');
        const res = await fetch(`${API_BASE}/videos`);
        debug(`Response status: ${res.status} ${res.statusText}`);
        console.log('📡 Response:', res.status);
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        console.log('📦 Data received:', data);
        console.log('📦 Data type:', typeof data);
        console.log('📦 Data keys:', data ? Object.keys(data) : 'null');
        
        allVideos = extractArray(data);
        console.log('✅ Extracted videos:', allVideos.length);
        
        debug(`✅ Loaded ${allVideos.length} videos`);
        renderVideos();
        
    } catch (err) {
        console.error('❌ Error:', err);
        debug(`❌ Error: ${err.message}`);
        c.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-exclamation-triangle" style="color:#ef4444"></i>
                <p style="color:#ef4444; font-size:1.1rem; font-weight:700;">දෝෂයක්: ${err.message}</p>
                <p style="color:#64748b; font-size:0.85rem; margin-top:0.5rem;">F12 → Console එකේ විස්තර බලන්න</p>
            </div>
        `;
    }
}

function renderVideos() {
    const c = document.getElementById('videosContainer');
    
    if (allVideos.length === 0) {
        c.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-video-slash"></i>
                <p style="color:#64748b; font-size:1.1rem; font-weight:700;">වීඩියෝ නොමැත</p>
                <p style="color:#94a3b8; font-size:0.85rem; margin-top:0.5rem;">API එකේ videos data නැහැ හෝ response format වැරදි</p>
            </div>
        `;
        debug('⚠️ No videos to render');
        return;
    }
    
    console.log('🎨 Rendering', allVideos.length, 'videos');
    
    c.innerHTML = allVideos.map(v => {
        const youtubeId = v.youtube_id || extractYouTubeId(v.video_url) || '';
        const thumbnail = youtubeId ? `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg` : 'https://via.placeholder.com/400x200/0F2C59/D4A017?text=Video';
        return `
            <div class="video-card" onclick="openVideo(${v.id})">
                <div class="video-thumb">
                    <img src="${thumbnail}" alt="${escapeHtml(v.title)}" onerror="this.src='https://via.placeholder.com/400x200/0F2C59/D4A017?text=Video'">
                    <span class="video-badge">${escapeHtml(v.grade_name || 'Video')}</span>
                </div>
                <div class="video-info">
                    <h3>${escapeHtml(v.title)}</h3>
                    <p><i class="fa-solid fa-graduation-cap mr-1"></i>${escapeHtml(v.grade_name || '')} ${v.subject_name ? '• ' + escapeHtml(v.subject_name) : ''}</p>
                </div>
            </div>
        `;
    }).join('');
    
    debug(`✅ Rendered ${allVideos.length} videos`);
}

function openVideo(id) {
    const v = allVideos.find(x => x.id === id);
    if (!v) return;
    const ytId = v.youtube_id || extractYouTubeId(v.video_url);
    if (ytId) window.open(`https://www.youtube.com/watch?v=${ytId}`, '_blank');
    else alert('මෙම වීඩියෝවට YouTube ID එකක් නැහැ');
}

function extractYouTubeId(url) {
    if (!url) return null;
    const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
    return match ? match[1] : null;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

document.addEventListener('DOMContentLoaded', () => {
    console.log('✅ DOMContentLoaded fired');
    loadTheme();
    loadVideos();
});

window.addEventListener('error', (e) => {
    console.error('💥 Global error:', e.message);
    debug(`💥 Error: ${e.message}`);
});

console.log('✅ videos.html script END');
</script>

</body>
</html>
