<script>
const API_BASE = '/api';

let allPapers = [];
let filteredPapers = [];

// ============================================
// THEME
// ============================================
function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}

function loadTheme() {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
    }
}

function toggleMobileMenu() {
    document.getElementById('mobileMenu').classList.toggle('hidden');
}

// ============================================
// LOAD PAPERS
// ============================================
async function loadPapers() {
    const container = document.getElementById('papersContainer');
    
    try {
        const res = await fetch(`${API_BASE}/resources?type=paper&limit=100`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const data = await res.json();
        allPapers = data.papers || data.data || data || [];
        filteredPapers = [...allPapers];
        
        console.log('✅ Papers loaded:', allPapers.length);
        renderPapers();
        
    } catch (err) {
        console.error('❌ Paper load error:', err);
        container.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-exclamation-triangle" style="color: #ef4444;"></i>
                <p class="text-red-500 text-lg font-bold">දෝෂයක්: ${err.message}</p>
            </div>
        `;
    }
}

// ============================================
// LOAD FILTERS
// ============================================
async function loadFilters() {
    try {
        const [gradesRes, subjectsRes] = await Promise.all([
            fetch(`${API_BASE}/grades`),
            fetch(`${API_BASE}/subjects`)
        ]);
        
        const grades = await gradesRes.json();
        const subjects = await subjectsRes.json();
        
        const gradesArr = Array.isArray(grades) ? grades : (grades.grades || []);
        const subjectsArr = Array.isArray(subjects) ? subjects : (subjects.subjects || []);
        
        const gradeFilter = document.getElementById('gradeFilter');
        gradesArr.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g.id;
            opt.textContent = g.grade_name;
            gradeFilter.appendChild(opt);
        });
        
        const subjectFilter = document.getElementById('subjectFilter');
        subjectsArr.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.subject_name;
            subjectFilter.appendChild(opt);
        });
        
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        gradeFilter.addEventListener('change', applyFilters);
        subjectFilter.addEventListener('change', applyFilters);
        document.getElementById('typeFilter').addEventListener('change', applyFilters);
        
    } catch (err) {
        console.error('Filter load error:', err);
    }
}

// ============================================
// APPLY FILTERS
// ============================================
function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const gradeId = document.getElementById('gradeFilter').value;
    const subjectId = document.getElementById('subjectFilter').value;
    const type = document.getElementById('typeFilter').value;
    
    filteredPapers = allPapers.filter(p => {
        if (search && !(p.title || '').toLowerCase().includes(search)) return false;
        if (gradeId && String(p.grade_id) !== gradeId) return false;
        if (subjectId && String(p.subject_id) !== subjectId) return false;
        if (type && p.paper_type !== type) return false;
        return true;
    });
    
    renderPapers();
}

// ============================================
// RENDER PAPERS
// ============================================
function renderPapers() {
    const container = document.getElementById('papersContainer');
    
    if (filteredPapers.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-folder-open"></i>
                <p class="text-gray-500 text-lg font-bold">ප්‍රශ්න පත්‍ර නොමැත</p>
                <p class="text-gray-400 text-sm mt-2">කරුණාකර පසුව නැවත උත්සාහ කරන්න</p>
            </div>
        `;
        return;
    }
    
    const typeMap = {
        term: 'වාර පරීක්ෂණය',
        school: 'පාසල් පරීක්ෂණය',
        practice: 'පුහුණු',
        exam: 'විභාගය',
        model: 'ආදර්ශ'
    };
    
    container.innerHTML = filteredPapers.map(p => `
        <div class="paper-card">
            <div class="paper-header">
                <i class="fa-solid fa-file-pdf"></i>
                <span class="paper-badge">${typeMap[p.paper_type] || 'ප්‍රශ්න පත්‍රය'}</span>
                ${p.year ? `<span class="paper-year-badge">${p.year}</span>` : ''}
            </div>
            <div class="paper-info">
                <h3>${escapeHtml(p.title || 'N/A')}</h3>
                <p>
                    ${p.grade_name ? `<span><i class="fa-solid fa-graduation-cap text-brand-gold"></i> ${escapeHtml(p.grade_name)}</span>` : ''}
                    ${p.subject_name ? `<span><i class="fa-solid fa-book text-brand-gold"></i> ${escapeHtml(p.subject_name)}</span>` : ''}
                </p>
            </div>
            <div class="paper-actions">
                ${p.pdf_file ? `
                    <a href="${p.pdf_file}" target="_blank" class="btn-download">
                        <i class="fa-solid fa-download"></i>PDF බලන්න
                    </a>
                ` : `
                    <button class="btn-download disabled" disabled>
                        <i class="fa-solid fa-file-pdf"></i>PDF නොමැත
                    </button>
                `}
            </div>
        </div>
    `).join('');
}

// ============================================
// HELPERS
// ============================================
function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ============================================
// INIT
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    loadTheme();
    loadFilters();
    loadPapers();
});
</script>

</body>
</html>
