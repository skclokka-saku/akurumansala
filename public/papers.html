<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ප්‍රශ්න පත්‍ර | අකුරු මංසල</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-navy': '#1e293b',
                        'brand-gold': '#D4A017',
                        'brand-gold2': '#fbbf24',
                    },
                    fontFamily: {
                        'sinhala': ['Noto Sans Sinhala', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans Sinhala', sans-serif; }
        .stat-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            transform: translateY(-2px);
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .dark body { background-color: #0f172a; color: #e2e8f0; }
        .dark .stat-card { background-color: #1e293b; color: #e2e8f0; }
        .dark .text-brand-navy { color: #f1f5f9; }
        .dark .text-gray-500 { color: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2">
                <img src="/images/logo.png" alt="Logo" class="w-10 h-10 rounded-lg" onerror="this.style.display='none'">
                <div>
                    <h1 class="font-black text-brand-navy text-lg leading-tight">අකුරු මංසල</h1>
                    <p class="text-[10px] text-gray-500">ඉගෙනුමට නව මඟක්</p>
                </div>
            </a>
            <nav class="hidden md:flex items-center space-x-6 text-sm font-bold">
                <a href="/" class="text-gray-600 hover:text-brand-gold transition">මුල් පිටුව</a>
                <a href="/resources.html" class="text-gray-600 hover:text-brand-gold transition">සම්පත්</a>
                <a href="/papers.html" class="text-brand-gold">ප්‍රශ්න පත්‍ර</a>
                <a href="/videos.html" class="text-gray-600 hover:text-brand-gold transition">වීඩියෝ</a>
            </nav>
            <a href="/admin.html" class="bg-brand-gold text-brand-navy px-4 py-2 rounded-lg font-bold text-sm hover:bg-brand-gold2 transition">
                <i class="fa-solid fa-user-shield mr-1"></i> Admin
            </a>
        </div>
    </header>

    <!-- Hero -->
    <section class="bg-brand-navy text-white py-12">
        <div class="max-w-7xl mx-auto px-4">
            <p class="text-brand-gold text-xs font-black tracking-widest uppercase mb-2">Practice Papers</p>
            <h1 class="text-4xl md:text-5xl font-black mb-2">ප්‍රශ්න පත්‍ර</h1>
            <p class="text-white/70 text-sm">පාසල් පරීක්ෂණ, වාර පරීක්ෂණ සහ පුහුණු ප්‍රශ්න පත්‍ර</p>
        </div>
    </section>

    <!-- Filters -->
    <section class="max-w-7xl mx-auto px-4 -mt-6">
        <div class="bg-white rounded-2xl shadow-lg p-4 grid grid-cols-1 md:grid-cols-4 gap-3">
            <input type="text" id="searchInput" placeholder="සොයන්න..." class="border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-gold">
            <select id="gradeFilter" class="border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-gold">
                <option value="">සියලු ශ්‍රේණි</option>
            </select>
            <select id="subjectFilter" class="border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-gold">
                <option value="">සියලු විෂය</option>
            </select>
            <select id="typeFilter" class="border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-gold">
                <option value="">සියලු වර්ග</option>
                <option value="term">වාර පරීක්ෂණය</option>
                <option value="school">පාසල් පරීක්ෂණය</option>
                <option value="practice">පුහුණු</option>
                <option value="exam">විභාගය</option>
                <option value="model">ආදර්ශ</option>
            </select>
        </div>
    </section>

    <!-- Papers List -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="papersContainer">
            <div class="text-center py-12">
                <div class="w-12 h-12 border-4 border-brand-gold border-t-transparent rounded-full animate-spin mx-auto"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-brand-navy text-white py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-white/60">
            © 2026 අකුරු මංසල • සියලු හිමිකම් ඇවිරිණි
        </div>
    </footer>

    <!-- PDF Open Function -->
    <script>
        const API_BASE = '/api';

        // ============================================
        // PDF OPEN FUNCTION (Base64 සඳහා)
        // ============================================
        function openPdf(pdfData) {
            try {
                if (!pdfData || pdfData === 'null') {
                    alert('මෙම ප්‍රශ්න පත්‍රයට PDF ගොනුවක් අමුණා නැත');
                    return;
                }
                
                // Base64 data URL එකක් නම්
                if (pdfData.startsWith('data:')) {
                    const parts = pdfData.split(',');
                    const mime = parts[0].match(/:(.*?);/)[1];
                    const b64 = parts[1];
                    const binary = atob(b64);
                    const array = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        array[i] = binary.charCodeAt(i);
                    }
                    const blob = new Blob([array], { type: mime });
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                } else {
                    window.open(pdfData, '_blank');
                }
            } catch (e) {
                console.error('PDF open error:', e);
                alert('PDF එක open කිරීමේ දෝෂයක්: ' + e.message);
            }
        }

        // ============================================
        // LOAD PAPERS
        // ============================================
        async function loadPapers() {
            const container = document.getElementById('papersContainer');
            
            try {
                const res = await fetch(`${API_BASE}/papers`);
                const papers = await res.json();
                
                if (!papers || papers.length === 0) {
                    container.innerHTML = `
                        <div class="stat-card text-center py-16">
                            <i class="fa-solid fa-file-lines text-6xl text-gray-300 mb-4"></i>
                            <p class="text-gray-500 text-lg">ප්‍රශ්න පත්‍ර නොමැත</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${papers.map(p => `
                            <div class="stat-card border-t-4 border-brand-gold p-6">
                                <div class="flex items-start space-x-4">
                                    <div class="w-14 h-14 rounded-xl bg-pink-100 text-pink-600 flex items-center justify-center flex-shrink-0">
                                        <i class="fa-solid fa-file-pdf text-2xl"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <h3 class="font-bold text-brand-navy text-base mb-1 line-clamp-2">${p.title}</h3>
                                        <p class="text-xs text-gray-500 mb-3">
                                            ${p.grade_name || ''} ${p.subject_name ? '• ' + p.subject_name : ''} ${p.year ? '• ' + p.year : ''}
                                        </p>
                                        <button onclick='openPdf("${p.pdf_file}")' class="text-brand-gold font-bold text-sm hover:text-brand-navy transition flex items-center gap-1">
                                            බලන්න <i class="fa-solid fa-arrow-right"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (err) {
                console.error('Load error:', err);
                container.innerHTML = `
                    <div class="stat-card text-center py-16">
                        <i class="fa-solid fa-exclamation-circle text-6xl text-red-300 mb-4"></i>
                        <p class="text-red-500">දෝෂයක්: ${err.message}</p>
                    </div>
                `;
            }
        }

        // Load on page start
        document.addEventListener('DOMContentLoaded', loadPapers);
    </script>

</body>
</html>
