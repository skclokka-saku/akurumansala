<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පිවිසෙන්න | අකුරු මංසල</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600;700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-navy': '#0F2C59',
                        'brand-gold': '#D4A017',
                        'brand-gold2': '#E8B923',
                    },
                    fontFamily: {
                        sinhala: ['"Noto Serif Sinhala"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Serif Sinhala', 'Poppins', sans-serif; }
        .login-bg {
            background: linear-gradient(135deg, #0F2C59 0%, #1B3A6B 50%, #0F2C59 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .login-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 160, 23, 0.2), transparent);
            border-radius: 50%;
            animation: floatCircle 8s ease-in-out infinite;
        }
        .login-bg::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 160, 23, 0.15), transparent);
            border-radius: 50%;
            animation: floatCircle 10s ease-in-out infinite reverse;
        }
        @keyframes floatCircle {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }
        .login-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }
        .login-logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }
        .form-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.85rem;
            font-size: 0.95rem;
            transition: all 0.3s;
            font-family: inherit;
            background: white;
        }
        .form-input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 1rem 1.25rem;
            border-radius: 0.85rem;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .demo-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 0.85rem;
            padding: 1rem 1.25rem;
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="login-bg">

    <!-- Back to Home -->
    <div class="absolute top-6 left-6 z-20">
        <a href="/" class="inline-flex items-center gap-2 text-white/80 hover:text-white font-bold text-sm transition">
            <i class="fa-solid fa-arrow-left"></i>
            <span>මුල් පිටුවට</span>
        </a>
    </div>

    <!-- Login Card -->
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="login-card w-full max-w-md p-8 md:p-10">

            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <div class="login-logo">
                    <i class="fa-solid fa-graduation-cap text-white text-4xl"></i>
                </div>
            </div>

            <!-- Title -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-brand-navy mb-2">අකුරු මංසල</h1>
                <p class="text-sm text-gray-500 font-semibold">පද්ධතියට පිවිසෙන්න</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message mb-6 hidden">
                <i class="fa-solid fa-exclamation-circle"></i>
                <span id="errorText">පිවිසුම අසාර්ථකයි</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-envelope text-purple-500 mr-2"></i>විද්‍යුත් තැපෑල
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        required 
                        class="form-input" 
                        placeholder="your@email.com"
                        autocomplete="email"
                    >
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-lock text-purple-500 mr-2"></i>මුරපදය
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        class="form-input" 
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" id="loginBtn" class="btn-login">
                    <i class="fa-solid fa-sign-in-alt"></i>
                    <span>පිවිසෙන්න</span>
                </button>
            </form>

            <!-- Demo Box -->
            <div class="demo-box mt-6">
                <p class="font-bold text-blue-800 mb-2">
                    <i class="fa-solid fa-info-circle mr-1"></i>පිවිසුම් විස්තර:
                </p>
                <p class="text-blue-700"><strong>Developer:</strong> skclokka@gmail.com / Admin@web123</p>
                <p class="text-blue-700"><strong>Teacher:</strong> teacher@akurumansala.lk / teacher123</p>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = '/api';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            // Reset error
            errorDiv.classList.add('hidden');

            // Validate
            if (!email || !password) {
                errorText.textContent = 'විද්‍යුත් තැපෑල සහ මුරපදය ඇතුළත් කරන්න';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>පිවිසෙමින්...</span>';

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'පිවිසුම අසාර්ථකයි');
                }

                // Save token and user
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Redirect based on role
                if (data.user.role === 'web_developer' || data.user.role === 'admin' || data.user.role === 'teacher') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/';
                }

            } catch (err) {
                console.error('Login error:', err);
                errorText.textContent = err.message || 'පිවිසුම අසාර්ථකයි. නැවත උත්සාහ කරන්න.';
                errorDiv.classList.remove('hidden');
                
                // Re-enable button
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fa-solid fa-sign-in-alt"></i><span>පිවිසෙන්න</span>';
            }
        });

        // Auto-fill demo if URL has ?demo=developer
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('demo') === 'developer') {
                document.getElementById('email').value = 'skclokka@gmail.com';
                document.getElementById('password').value = 'Admin@web123';
            }
        });
    </script>

</body>
</html>
