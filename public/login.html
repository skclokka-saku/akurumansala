<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පිවිසෙන්න | අකුරු මංසල</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Serif Sinhala', sans-serif; }
        .glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #f0f9ff, #fff1f2, #fefce8);">

    <div class="w-full max-w-md">
        <div class="glass rounded-[2rem] p-8 sm:p-10 shadow-2xl border border-white">
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto bg-gradient-to-tr from-pink-400 via-purple-500 to-indigo-500 rounded-3xl flex items-center justify-center text-white text-3xl font-black shadow-xl mb-4">අ</div>
                <h1 class="text-3xl font-black text-slate-800">අකුරු මංසල</h1>
                <p class="text-slate-500 mt-2">පද්ධතියට පිවිසෙන්න</p>
            </div>

            <div id="alertBox" class="hidden mb-4 p-4 rounded-xl text-sm"></div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">විද්‍යුත් තැපෑල</label>
                    <input type="email" id="email" required placeholder="admin@akurumansala.lk" 
                           class="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">මුරපදය</label>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:outline-none focus:border-pink-500 focus:ring-4 focus:ring-pink-100">
                </div>
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold rounded-2xl shadow-lg hover:scale-[1.02] transition">
                    <i class="fa-solid fa-sign-in-alt mr-2"></i> පිවිසෙන්න
                </button>
            </form>

            <div class="mt-6 p-4 bg-blue-50 rounded-2xl text-xs text-slate-600">
                <p class="font-bold mb-1"><i class="fa-solid fa-info-circle text-blue-500 mr-1"></i> Demo ගිණුම්:</p>
                <p>Admin: admin@akurumansala.lk / admin123</p>
                <p>Teacher: teacher@akurumansala.lk / teacher123</p>
            </div>

            <p class="text-center text-sm text-slate-500 mt-6">
                <a href="/" class="hover:text-pink-600"><i class="fa-solid fa-arrow-left mr-1"></i> මුල් පිටුවට</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'පිවිසීම අසාර්ථකයි');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                alertBox.className = 'mb-4 p-4 rounded-xl text-sm bg-green-100 text-green-700';
                alertBox.textContent = 'සාර්ථකව පිවිසුණි! රැගෙන යමින්...';
                alertBox.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = data.user.role === 'admin' ? '/admin.html' : '/';
                }, 800);
            } catch (err) {
                alertBox.className = 'mb-4 p-4 rounded-xl text-sm bg-red-100 text-red-700';
                alertBox.textContent = err.message;
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
