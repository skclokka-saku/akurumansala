<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පිවිසෙන්න | අකුරු මංසල</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600;700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Serif Sinhala', 'Poppins', sans-serif; }
        .login-bg {
            background: linear-gradient(135deg, #0F2C59 0%, #1B3A6B 50%, #0F2C59 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .login-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 160, 23, 0.2), transparent);
            border-radius: 50%;
            animation: floatCircle 8s ease-in-out infinite;
        }
        .login-bg::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 160, 23, 0.15), transparent);
            border-radius: 50%;
            animation: floatCircle 10s ease-in-out infinite reverse;
        }
        @keyframes floatCircle {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }
        .login-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }
        .login-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }
        .form-input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.85rem;
            font-size: 0.95rem;
            transition: all 0.3s;
            font-family: inherit;
            background: white;
        }
        .form-input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5);
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 1rem 1.25rem;
            border-radius: 0.85rem;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: shake 0.5s;
        }
        .success-message {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #16a34a;
            padding: 1rem 1.25rem;
            border-radius: 0.85rem;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .tab-btn {
            padding: 0.75rem 1.5rem;
            font-weight: 800;
            border-radius: 0.75rem;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            flex: 1;
            font-size: 0.875rem;
        }
        .tab-active {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
        }
        .tab-inactive {
            background: #f1f5f9;
            color: #64748b;
        }
        .tab-inactive:hover { background: #e2e8f0; }
    </style>
</head>
<body class="login-bg">

    <div class="absolute top-6 left-6 z-20">
        <a href="/" class="inline-flex items-center gap-2 text-white/80 hover:text-white font-bold text-sm transition">
            <i class="fa-solid fa-arrow-left"></i>
            <span>මුල් පිටුවට</span>
        </a>
    </div>

    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="login-card w-full max-w-md p-6 md:p-10">

            <div class="flex justify-center mb-6">
                <div class="login-logo">
                    <i class="fa-solid fa-graduation-cap text-white text-3xl"></i>
                </div>
            </div>

            <div class="text-center mb-6">
                <h1 class="text-2xl md:text-3xl font-black mb-2" style="color: #0F2C59;">අකුරු මංසල</h1>
                <p class="text-sm text-gray-500 font-semibold">ඔබේ ගිණුමට පිවිසෙන්න</p>
            </div>

            <!-- Tabs -->
            <div id="tabsContainer" class="flex gap-2 mb-6 bg-gray-50 p-1.5 rounded-xl">
                <button onclick="switchTab('login')" id="tabLogin" class="tab-btn tab-active">
                    <i class="fa-solid fa-sign-in-alt mr-2"></i>පිවිසෙන්න
                </button>
                <button onclick="switchTab('signup')" id="tabSignup" class="tab-btn tab-inactive">
                    <i class="fa-solid fa-user-plus mr-2"></i>ලියාපදිංචි
                </button>
            </div>

            <div id="messageBox" class="mb-5 hidden"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-envelope text-purple-500 mr-2"></i>විද්‍යුත් තැපෑල
                    </label>
                    <input type="email" id="loginEmail" required class="form-input" placeholder="your@email.com">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-lock text-purple-500 mr-2"></i>මුරපදය
                    </label>
                    <input type="password" id="loginPassword" required class="form-input" placeholder="••••••••">
                </div>
                <div class="text-right">
                    <button type="button" onclick="switchTab('forgot')" class="text-sm text-purple-600 hover:text-purple-800 font-bold">
                        මුරපදය අමතක වුණාද?
                    </button>
                </div>
                <button type="submit" id="loginBtn" class="btn-login">
                    <i class="fa-solid fa-sign-in-alt"></i>
                    <span>පිවිසෙන්න</span>
                </button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-user text-purple-500 mr-2"></i>සම්පූර්ණ නම
                    </label>
                    <input type="text" id="signupName" required class="form-input" placeholder="ඔබේ නම">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-envelope text-purple-500 mr-2"></i>විද්‍යුත් තැපෑල
                    </label>
                    <div class="flex gap-2">
                        <input type="email" id="signupEmail" required class="form-input" placeholder="your@email.com">
                        <button type="button" id="sendEmailCodeBtn" onclick="sendEmailCode()" class="px-4 py-2 bg-purple-600 text-white font-bold rounded-xl hover:bg-purple-700 transition text-sm whitespace-nowrap">
                            කේතය යවන්න
                        </button>
                    </div>
                </div>
                <div id="emailCodeField" class="hidden">
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-key text-purple-500 mr-2"></i>තහවුරු කිරීමේ කේතය (ඊමේල් එකට එවන ලදී)
                    </label>
                    <input type="text" id="signupEmailCode" class="form-input" placeholder="6 අංක කේතය" maxlength="6">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-phone text-purple-500 mr-2"></i>දුරකථන අංකය
                    </label>
                    <input type="tel" id="signupPhone" required class="form-input" placeholder="0712345678" maxlength="10">
                    <p class="text-xs text-gray-500 mt-1">උදා: 0712345678</p>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-school text-purple-500 mr-2"></i>පාසල (අවශ්‍ය නැහැ)
                    </label>
                    <input type="text" id="signupSchool" class="form-input" placeholder="ඔබේ පාසලේ නම">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-lock text-purple-500 mr-2"></i>මුරපදය
                    </label>
                    <input type="password" id="signupPassword" required class="form-input" placeholder="අවම 6 අක්ෂර" minlength="6">
                </div>
                <button type="submit" id="signupBtn" class="btn-login">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>ලියාපදිංචි වන්න</span>
                </button>
            </form>

            <!-- FORGOT PASSWORD FORM -->
            <form id="forgotForm" class="space-y-4 hidden">
                <div class="text-center mb-4">
                    <div class="w-16 h-16 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center mx-auto mb-3">
                        <i class="fa-solid fa-key text-2xl"></i>
                    </div>
                    <h3 class="font-black text-lg" style="color: #0F2C59;">මුරපදය අමතක වුණාද?</h3>
                    <p class="text-sm text-gray-500 mt-1">ඔබේ විද්‍යුත් තැපෑල ඇතුළත් කරන්න</p>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-envelope text-purple-500 mr-2"></i>විද්‍යුත් තැපෑල
                    </label>
                    <input type="email" id="forgotEmail" required class="form-input" placeholder="your@email.com">
                </div>
                <button type="submit" id="forgotBtn" class="btn-login">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Reset Link යවන්න</span>
                </button>
                <button type="button" onclick="switchTab('login')" class="w-full text-sm text-gray-500 hover:text-gray-700 font-bold py-2">
                    ← පිවිසුම් පිටුවට
                </button>
            </form>

        </div>
    </div>

    <script>
        const API_BASE = '/api';

        // ============================================
        // MESSAGE DISPLAY
        // ============================================
        function showMessage(message, type = 'error') {
            const box = document.getElementById('messageBox');
            const className = type === 'error' ? 'error-message' : 'success-message';
            const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
            
            box.className = className;
            box.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
            box.classList.remove('hidden');
            
            setTimeout(() => box.classList.add('hidden'), 7000);
        }

        // ============================================
        // TAB SWITCHING
        // ============================================
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const forgotForm = document.getElementById('forgotForm');
            const tabsContainer = document.getElementById('tabsContainer');
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');
            const messageBox = document.getElementById('messageBox');

            messageBox.classList.add('hidden');

            loginForm.classList.add('hidden');
            signupForm.classList.add('hidden');
            forgotForm.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                tabsContainer.classList.remove('hidden');
                tabLogin.className = 'tab-btn tab-active';
                tabSignup.className = 'tab-btn tab-inactive';
            } else if (tab === 'signup') {
                signupForm.classList.remove('hidden');
                tabsContainer.classList.remove('hidden');
                tabLogin.className = 'tab-btn tab-inactive';
                tabSignup.className = 'tab-btn tab-active';
            } else if (tab === 'forgot') {
                forgotForm.classList.remove('hidden');
                tabsContainer.classList.add('hidden');
            }
        }

        // ============================================
        // LOGIN
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>පිවිසෙමින්...</span>';

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'පිවිසුම අසාර්ථකයි');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showMessage('සාර්ථකව පිවිසුණා! යොමු කරමින්...', 'success');

                setTimeout(() => {
                    if (['web_developer', 'admin', 'teacher'].includes(data.user.role)) {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/';
                    }
                }, 800);

            } catch (err) {
                showMessage(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-sign-in-alt"></i><span>පිවිසෙන්න</span>';
            }
        });

        // ============================================
        // SEND EMAIL CODE
        // ============================================
        async function sendEmailCode() {
            const email = document.getElementById('signupEmail').value.trim();
            const btn = document.getElementById('sendEmailCodeBtn');

            if (!email) {
                showMessage('විද්‍යුත් තැපෑල ඇතුළත් කරන්න', 'error');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('වලංගු විද්‍යුත් තැපෑලක් ඇතුළත් කරන්න', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const res = await fetch(`${API_BASE}/auth/send-email-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, purpose: 'signup' })
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'කේතය යැවීම අසාර්ථකයි');

                document.getElementById('emailCodeField').classList.remove('hidden');
                showMessage(data.message, 'success');

                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-redo"></i> නැවත යවන්න';

            } catch (err) {
                showMessage(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'කේතය යවන්න';
            }
        }

        // ============================================
        // SIGNUP
        // ============================================
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const emailCode = document.getElementById('signupEmailCode').value.trim();
            const school = document.getElementById('signupSchool').value.trim();
            const password = document.getElementById('signupPassword').value;
            const btn = document.getElementById('signupBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>ලියාපදිංචි වෙමින්...</span>';

            try {
                // Verify email code first
                if (emailCode) {
                    const verifyRes = await fetch(`${API_BASE}/auth/verify-email-code`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, code: emailCode })
                    });

                    const verifyData = await verifyRes.json();
                    if (!verifyRes.ok) throw new Error(verifyData.error || 'කේතය තහවුරු කිරීම අසාර්ථකයි');
                } else {
                    throw new Error('තහවුරු කිරීමේ කේතය ඇතුළත් කරන්න');
                }

                // Register
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, school, phone, emailCode })
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'ලියාපදිංචි වීම අසාර්ථකයි');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showMessage('සාර්ථකව ලියාපදිංචි වුණා! යොමු කරමින්...', 'success');

                setTimeout(() => {
                    window.location.href = '/admin.html';
                }, 1000);

            } catch (err) {
                showMessage(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i><span>ලියාපදිංචි වන්න</span>';
            }
        });

        // ============================================
        // FORGOT PASSWORD
        // ============================================
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('forgotEmail').value.trim();
            const btn = document.getElementById('forgotBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>යවමින්...</span>';

            try {
                const res = await fetch(`${API_BASE}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'දෝෂයක්');

                showMessage(data.message, 'success');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i><span>Reset Link යවන්න</span>';

            } catch (err) {
                showMessage(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i><span>Reset Link යවන්න</span>';
            }
        });
    </script>

</body>
</html>
