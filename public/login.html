<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>පිවිසෙන්න | අකුරු මංසල</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600;700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Serif Sinhala', 'Poppins', sans-serif; }
        .login-bg {
            background: linear-gradient(135deg, #0F2C59 0%, #1B3A6B 50%, #0F2C59 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .login-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 160, 23, 0.2), transparent);
            border-radius: 50%;
            animation: floatCircle 8s ease-in-out infinite;
        }
        .login-bg::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 160, 23, 0.15), transparent);
            border-radius: 50%;
            animation: floatCircle 10s ease-in-out infinite reverse;
        }
        @keyframes floatCircle {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }
        .login-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }
        .login-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }
        .form-input {
            width: 100%;
            padding: 0.9rem 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.85rem;
            font-size: 0.95rem;
            transition: all 0.3s;
            font-family: inherit;
            background: white;
        }
        .form-input:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #ec4899, #a855f7);
            color: white;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 0.85rem;
            border: none;
            cursor: pointer;
            transition: all 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.5);
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 1rem 1.25rem;
            border-radius: 0.85rem;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: shake 0.5s;
        }
        .success-message {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #16a34a;
            padding: 1rem 1.25rem;
            border-radius: 0.85rem;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="login-bg">

    <div class="absolute top-6 left-6 z-20">
        <a href="/" class="inline-flex items-center gap-2 text-white/80 hover:text-white font-bold text-sm transition">
            <i class="fa-solid fa-arrow-left"></i>
            <span>මුල් පිටුවට</span>
        </a>
    </div>

    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="login-card w-full max-w-md p-6 md:p-10">

            <div class="flex justify-center mb-6">
                <div class="login-logo">
                    <i class="fa-solid fa-graduation-cap text-white text-3xl"></i>
                </div>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-black mb-2" style="color: #0F2C59;">අකුරු මංසල</h1>
                <p class="text-sm text-gray-500 font-semibold">පද්ධතියට පිවිසෙන්න</p>
                <p class="text-xs text-gray-400 mt-2">(Admin / Teacher පමණි)</p>
            </div>

            <div id="messageBox" class="mb-5 hidden"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-envelope text-purple-500 mr-2"></i>විද්‍යුත් තැපෑල
                    </label>
                    <input type="email" id="loginEmail" required class="form-input" placeholder="your@email.com" autocomplete="email">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="fa-solid fa-lock text-purple-500 mr-2"></i>මුරපදය
                    </label>
                    <input type="password" id="loginPassword" required class="form-input" placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" id="loginBtn" class="btn-login">
                    <i class="fa-solid fa-sign-in-alt"></i>
                    <span>පිවිසෙන්න</span>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t text-center">
                <p class="text-xs text-gray-400">
                    <i class="fa-solid fa-info-circle mr-1"></i>
                    මෙම පද්ධතියට පිවිසිය හැක්කේ අනුමත පරිශීලකයින්ට පමණි.
                </p>
            </div>

        </div>
    </div>

    <script>
        const API_BASE = '/api';

        function showMessage(message, type = 'error') {
            const box = document.getElementById('messageBox');
            const className = type === 'error' ? 'error-message' : 'success-message';
            const icon = type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle';
            
            box.className = className;
            box.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
            box.classList.remove('hidden');
            
            setTimeout(() => box.classList.add('hidden'), 7000);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>පිවිසෙමින්...</span>';

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'පිවිසුම අසාර්ථකයි');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showMessage('සාර්ථකව පිවිසුණා! යොමු කරමින්...', 'success');

                setTimeout(() => {
                    window.location.href = '/admin.html';
                }, 800);

            } catch (err) {
                showMessage(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-sign-in-alt"></i><span>පිවිසෙන්න</span>';
            }
        });
    </script>

</body>
</html>
